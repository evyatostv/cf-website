name: Auto Blog Post

on:
  schedule:
    # Every Sunday at 08:00 UTC (11:00 Israel time)
    - cron: '0 8 * * 0'
  workflow_dispatch: # Allow manual trigger from GitHub UI

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate blog post
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node scripts/generate-blog-post.mjs

      - name: Open generated post for review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "ClinicFlow Bot"
          git config user.email "bot@clinic-flow.co.il"
          git add src-2/app/data/blog-posts.ts
          if git diff --staged --quiet; then
            echo "No generated post to review"
            exit 0
          fi
          branch="automation/blog-draft-$(date +%Y-%m-%d)-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git commit -m "blog: generated draft $(date +%Y-%m-%d) [skip ci]"
          git push --set-upstream origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "Review generated ClinicFlow blog draft ($(date +%Y-%m-%d))" \
            --body "AI-generated draft for editorial review. Verify every factual claim, remove unsupported statistics or advice, and confirm the ClinicFlow product facts before merging."
